<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SG IPTV</title>

  <!-- ✔ FAVICON (ÚNICA ALTERAÇÃO) -->
  <link rel="icon" href="/favicon.ico">
  <link rel="shortcut icon" href="/favicon.ico">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <img src="assets/logo.png" class="logo">

  <nav>
    <a href="#inicio">Início</a>
    <a href="#teste-gratis">Teste</a>
    <a href="#planos">Planos</a>
    <a href="#checkout">Pagamento</a>
  </nav>

  <a class="client-btn" href="https://sgiptv.com.br/cliente.html" target="_blank">
    Área do Cliente
  </a>
</header>

<section id="inicio" class="hero">
  <h1>ASSISTA TUDO COM A <span>SG IPTV</span></h1>
  <p>Canais, filmes e séries sem travamentos</p>
</section>

<section id="planos" class="plans-section">

  <h2>ESCOLHA SEU PLANO</h2>

  <div class="plans">

    <div class="plan destaque">
      <div class="tag">🔥 DESTAQUE</div>
      <h3>Mensal</h3>
      <h4>1 Tela</h4>
      <div class="price">R$ 30</div>
      <button onclick="selecionarPlano(30)">ESCOLHER</button>
    </div>

    <div class="plan">
      <h3>Mensal</h3>
      <h4>2 Telas</h4>
      <div class="price">R$ 50</div>
      <button onclick="selecionarPlano(50)">ESCOLHER</button>
    </div>

    <div class="plan">
      <h3>Trimestral</h3>
      <h4>1 Tela</h4>
      <div class="price">R$ 80</div>
      <button onclick="selecionarPlano(80)">ESCOLHER</button>
    </div>

    <div class="plan">
      <h3>Trimestral</h3>
      <h4>2 Telas</h4>
      <div class="price">R$ 140</div>
      <button onclick="selecionarPlano(140)">ESCOLHER</button>
    </div>

  </div>

</section>

<section id="checkout" class="checkout">

  <h2>PAGAMENTO PIX</h2>

  <select id="plano">
    <option value="30">Mensal 1 Tela</option>
    <option value="50">Mensal 2 Telas</option>
    <option value="80">Trimestral 1 Tela</option>
    <option value="140">Trimestral 2 Telas</option>
  </select>

  <input type="email" id="email" placeholder="Seu email">
  <input type="text" id="telefone" placeholder="Seu WhatsApp">

  <button onclick="gerarPix()">GERAR PIX</button>

  <div id="pix"></div>

</section>

<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SG IPTV</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loader">
  <img src="assets/logo.png" alt="SG IPTV">
</div>

<header class="header">
  <img src="assets/logo.png" class="logo" alt="SG IPTV">

  <nav>
    <a href="#inicio">Início</a>
    <a href="#teste-gratis">Teste</a>
    <a href="#planos">Planos</a>
    <a href="#checkout">Pagamento</a>
  </nav>

  <a class="client-btn" href="login.html">Área do Cliente</a>
</header>

<section id="inicio" class="hero">
  <div class="hero-content">
    <h1>SG IPTV</h1>
    <p>A melhor experiência em IPTV</p>
  </div>
</section>

<!-- TESTE -->
<section id="teste-gratis" class="checkout">
  <div class="checkout-box">
    <div class="checkout-left">
      <h2>TESTE GRÁTIS</h2>

      <label>TIPO DE TESTE</label>
      <select id="tipoTeste">
        <option value="iptv_com_adulto">⚡ IPTV C/ ADULTO</option>
        <option value="iptv_sem_adulto">⚡ IPTV S/ ADULTO</option>
        <option value="p2p">🔥 P2P</option>
      </select>

      <label>EMAIL</label>
      <input type="email" id="testeEmail">

      <label>WHATSAPP</label>
      <input type="text" id="testeTelefone">

      <button onclick="gerarTesteGratis()">GERAR TESTE</button>
    </div>

    <div class="checkout-right">
      <div id="resultadoTeste"></div>
    </div>
  </div>
</section>

<!-- PLANOS -->
<section id="planos">
  <h2>PLANOS</h2>

  <div class="plans">

    <div class="plan">
      <h3>MENSAL 1 TELA</h3>
      <p>R$ 30,00</p>
      <button onclick="selecionarPlano('30')">ESCOLHER</button>
    </div>

    <div class="plan">
      <h3>MENSAL 2 TELAS</h3>
      <p>R$ 50,00</p>
      <button onclick="selecionarPlano('50')">ESCOLHER</button>
    </div>

    <div class="plan">
      <h3>TRIMESTRAL 1 TELA</h3>
      <p>R$ 80,00</p>
      <button onclick="selecionarPlano('80')">ESCOLHER</button>
    </div>

    <div class="plan">
      <h3>TRIMESTRAL 2 TELAS</h3>
      <p>R$ 140,00</p>
      <button onclick="selecionarPlano('140')">ESCOLHER</button>
    </div>

  </div>
</section>

<!-- PAGAMENTO -->
<section id="checkout">
  <h2>PAGAMENTO</h2>

  <select id="plano">
    <option value="30">Mensal 1 Tela</option>
    <option value="50">Mensal 2 Telas</option>
    <option value="80">Trimestral 1 Tela</option>
    <option value="140">Trimestral 2 Telas</option>
  </select>

  <input type="email" id="email" placeholder="Seu email">
  <input type="text" id="telefone" placeholder="Seu WhatsApp">

  <button onclick="gerarPix()">GERAR PIX</button>

  <div id="pix"></div>
</section>

<script src="script.js"></script>
</body>
</html>

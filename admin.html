<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin - SG IPTV</title>

  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="cliente.css">
</head>
<body>


  
<div class="container">
  <div class="card painel-card">

    <div class="topo">
      <img src="assets/logo.png" alt="SG IPTV" class="logo-small">
      <button class="sair" onclick="sairAdmin()">Sair</button>
    </div>

    <h1>Painel Admin</h1>
    <p>Gerencie pagamentos, clientes e renovações.</p>

    <button onclick="carregarPagamentos()">Atualizar Pagamentos</button>

    <div id="adminMensagem"></div>

    <div class="renovar-box">
      <h2>Pagamentos</h2>

      <div class="tabela-area">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Email</th>
              <th>WhatsApp</th>
              <th>Plano</th>
              <th>Valor</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="listaPagamentos"></tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<div class="renovar-box">
  <h2>Testes IPTV</h2>

  <div class="tabela-area">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Email</th>
          <th>WhatsApp</th>
          <th>Login</th>
          <th>Senha</th>
        </tr>
      </thead>
      <tbody id="listaTestes"></tbody>
    </table>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>

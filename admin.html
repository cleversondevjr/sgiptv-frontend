<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Painel SG IPTV</title>
</head>
<body>

<h1>Painel SG IPTV</h1>

<button onclick="carregar()">Atualizar</button>
<button onclick="sair()">Sair</button>

<table border="1" cellpadding="8">
  <thead>
    <tr>
      <th>ID</th>
      <th>Email</th>
      <th>Plano</th>
      <th>Valor</th>
      <th>Status</th>
      <th>Ação</th>
    </tr>
  </thead>
  <tbody id="tabela"></tbody>
</table>

<script>
const token = localStorage.getItem("token_admin");

if (!token) {
  window.location.href = "login.html";
}

async function carregar() {
  const res = await fetch("https://sgiptv-backend.onrender.com/pagamentos", {
    headers: {
      Authorization: token
    }
  });

  if (res.status === 401) {
    localStorage.removeItem("token_admin");
    window.location.href = "login.html";
    return;
  }

  const dados = await res.json();
  const tabela = document.getElementById("tabela");

  tabela.innerHTML = "";

  dados.forEach(p => {
    tabela.innerHTML += `
      <tr>
        <td>${p.id}</td>
        <td>${p.email}</td>
        <td>${p.plano}</td>
        <td>R$ ${p.valor}</td>
        <td>${p.status}</td>
        <td>
          ${
            p.status === "confirmado"
            ? "Confirmado"
            : `<button onclick="confirmar(${p.id})">Confirmar</button>`
          }
        </td>
      </tr>
    `;
  });
}

async function confirmar(id) {
  await fetch(`https://sgiptv-backend.onrender.com/pagamentos/${id}/confirmar`, {
    method: "PUT",
    headers: {
      Authorization: token
    }
  });

  carregar();
}

function sair() {
  localStorage.removeItem("token_admin");
  window.location.href = "login.html";
}

carregar();
</script>

</body>
</html>
